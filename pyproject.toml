[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collectiveeval"
version = "0.1.0"
description = "Budget-aware evaluation tools for multi-agent LLM inference strategies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "PyYAML>=6",
  "numpy>=1.24",
  "scikit-learn>=1.2",
  "fastapi>=0.115",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10,<2",
]
providers = [
  "transformers>=4.40",
  "torch>=2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10,<2",
]
providers = [
  "transformers>=4.40",
  "torch>=2",
]

[project.scripts]
collectiveeval = "collectiveeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["fastapi", "yaml", "sklearn.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
